spring.application.name=educonnect
server.port=8080

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/sfs_educonnect
spring.datasource.username=root
spring.datasource.password=Admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT Secret (must be at least 32 chars)
jwt.secret=YOUR_VERY_SECRET_KEY_THAT_IS_AT_LEAST_32_CHARS_LONG
jwt.expiration=86400000   

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Upload directory (absolute or relative)
file.upload-dir=./uploads